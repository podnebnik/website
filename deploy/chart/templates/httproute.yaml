# Attaches to the shared Gateway `main` in kube-system (infrastructure repo
# owns it): wildcard TLS terminates there, external-dns publishes the
# hostname to Cloudflare.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: website
  {{- with .Values.httproute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: main
      namespace: kube-system
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    {{- if .Values.previewDatasette.enabled }}
    # Preview-only: same-origin /data → the pr-<N> datasette in this namespace,
    # mirroring the stage/prod /data routes the infrastructure repo serves
    # (PathPrefix /data rewritten to /). The website bundle for such a preview
    # is built with VITE_DATASETTE_URL=/data (see docker-preview.yaml).
    - matches:
        - path:
            type: PathPrefix
            value: /data
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: datasette
          port: 8001
    {{- end }}
    - backendRefs:
        - name: website
          port: 80
