{{- if .Values.previewDatasette.enabled }}
# Preview-only datasette, deployed alongside the website when the PR's
# docker-preview workflow built a ghcr.io/podnebnik/data:pr-<N> image (the
# workflow applies the `preview-data` PR label; the website-preview
# ApplicationSet in sledilnik/infrastructure keys previewDatasette.enabled on
# it). The website bundle for such a preview is built with
# VITE_DATASETTE_URL=/data, and httproute.yaml routes /data on the preview host
# to this Service. Never enabled for stage/prod — their datasettes are deployed
# from the infrastructure repo. Pruned with the namespace when the PR closes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datasette
  labels:
    app.kubernetes.io/name: datasette
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: datasette
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datasette
      annotations:
        # Same mutable-tag problem as the website Deployment, but templated: the
        # ApplicationSet passes the PR head SHA, so every push re-renders the
        # manifest and forces a rollout that re-pulls the pr-<n> tag.
        podnebnik.org/rollout-revision: {{ .Values.previewDatasette.revision | quote }}
    spec:
      containers:
        - name: datasette
          image: "{{ .Values.previewDatasette.image.repository }}:{{ .Values.previewDatasette.image.tag }}"
          # Preview envs reuse the mutable pr-<n> tag; Always ensures a recreated
          # pod pulls the freshly-built image instead of the node's cached copy.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8001
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.previewDatasette.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: datasette
  labels:
    app.kubernetes.io/name: datasette
spec:
  selector:
    app.kubernetes.io/name: datasette
  ports:
    - name: http
      port: 8001
      targetPort: http
{{- end }}
