name: "Daily data refresh"

# Daily refresh of the committed raw ERA5-Land station CSVs
# (data/climate-si/data/raw/<Station>.csv). The job runs mk_collect.py in
# DIFFERENTIAL mode, validates the result end to end, and opens a PULL REQUEST
# with raw appends only. It NEVER pushes to main — a human reviews and merges.
#
# WHY THE SCHEDULE IS NOW ENABLED (T-5.43, D-29):
# T-5.7d shipped this workflow deliberately inert behind two conditions, and BOTH
# are now satisfied — the T-4.3b meteo pass has landed and refresh-failure
# alerting exists (T-6.6a). D-29 sets the cadence to DAILY (not D-9's weekly):
# D-28 now publishes preliminary era5t rows, bringing the served data to ~0 days
# behind raw, so a weekly schedule would reintroduce as a cadence the six-day gap
# D-28 just removed from the pipeline. Costs are nil and measured (D-29): Actions
# minutes are free on public repos, a refresh is 18 light Open-Meteo differentials
# that trip no rate limit, and a daily append adds a few bytes per file.
#
# WHY VALIDATION RUNS IN THIS JOB, not only on the PR (D-19):
# a pull request opened with the workflow's GITHUB_TOKEN does NOT trigger
# `on: pull_request` workflows (GitHub suppresses it to avoid recursive runs).
# So validate-data.yaml and docker-data.yaml will NOT auto-run on the PR this
# job opens. To keep D-9's guarantee — nothing merges to the raw inputs without
# validation — this job runs the same raw-input contract (via the shared
# ./.github/actions/validate-raw-data composite) AND the derived pipeline
# (precompute_datasette.py, which validates before writing) in-job, and opens
# the PR only if both pass. Any validation failure fails the run loudly and no
# PR is opened. The PR body states that it carries no automated checks by design
# and links this run's log so a reviewer can see exactly what was checked.
#
# NO HASH MANIFEST IS CHECKED HERE (T-5.43, D-29). The T-5.17 gate used to hash the
# LIVE derived output; a daily refresh moves that every day, so gating on it would go
# red daily and be ignored. The "did the CODE change what the pipeline produces?"
# question now lives in tests/test_reference_manifest.py, which hashes precompute over
# a FROZEN fixture and moves only on code changes — and code enters only through human
# PRs, never a data-only refresh. So this job just validates the new data and opens a
# clean, mergeable PR; nothing here reddens on a legitimate data move.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >
          Type spend-quota to confirm. A run FETCHES from Open-Meteo and opens a
          pull request. The scheduled run bypasses this guard (it cannot type);
          the guard stays on MANUAL dispatch because that is the accident-prone
          path. Leave blank / any other value and the run aborts.
        required: true
        default: ''
  schedule:
    # Daily at 01:17 UTC. Cron is UTC: that is 03:17 CEST in summer and drifts to
    # 02:17 CET in winter — either way the small hours, off the top of the hour
    # (:17, not :00) because every cron fires on the hour and GitHub queues
    # scheduled jobs under load then. Enabled by T-5.43 (D-29); see the header for
    # the two conditions (T-4.3b landed, T-6.6a exists) that gated it until now.
    - cron: '17 1 * * *'  # daily 01:17 UTC

# Two refreshes must never race the same raw CSVs. Do not cancel an in-flight
# run: it may be mid-commit, and cancelling could leave a half-pushed branch.
concurrency:
  group: data-refresh
  cancel-in-progress: false

# Least privilege: only what opening a PR and alerting needs. `contents: write`
# creates the refresh branch and commit; `pull-requests: write` opens the PR;
# `issues: write` lets the failure-alert step open (or comment on, and label) a
# refresh-failure issue (T-6.6a). No packages, no id-token, no actions scope.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # MANUAL-dispatch guard (T-5.43). The SCHEDULED run bypasses this entirely
      # (`if:` below): a cron run cannot type anything, and D-29 removed the
      # reason the guard blocked all runs — the free-tier quota it protected was
      # reserved for the T-4.3b meteo pass, which has landed, and the mixed-
      # timezone stash it warned about is gone. The guard STAYS on manual dispatch
      # because that remains the accident-prone path: a stray click in the Actions
      # UI still fetches and opens a PR. It runs FIRST, before checkout/uv, and
      # aborts unless the dispatcher typed the exact confirmation string. On a
      # scheduled run this step is skipped, so its outcome is 'skipped' — the
      # failure-alert condition below is written to treat that as "no user error
      # to suppress", not as a reason to stay silent.
      - name: Require explicit confirmation
        id: confirm
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "spend-quota" ]; then
            echo "::error::Refresh aborted: confirmation input was not 'spend-quota'."
            echo "This guard exists because a MANUAL run is not free or silent:"
            echo "  - it fetches from Open-Meteo (18 light differentials) and"
            echo "  - it opens a pull request against main."
            echo "The scheduled daily run does this on its own; dispatch manually"
            echo "only to force an off-schedule refresh."
            echo "Re-dispatch with confirm=spend-quota only if you truly mean it."
            exit 1
          fi
          echo "Confirmation received (spend-quota) — proceeding with the refresh."

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        id: setup_uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      # DIFFERENTIAL mode — deliberately NO --force-refresh. mk_collect.py with no
      # flags appends only the days missing since the last commit plus the trailing
      # REFRESH_WINDOW (so preliminary era5t rows upgrade to final era5 in place).
      # --force-refresh would re-fetch ~76 years x 18 stations against the reserved
      # Open-Meteo free-tier quota — never do that from a scheduled job.
      # DATA_DIR points the collector at the tracked raw CSVs (default is /app/data/si).
      - name: Refresh raw station data (differential)
        id: fetch
        env:
          DATA_DIR: data/climate-si/data/raw
        run: uv run --project data/climate-si/sources python data/climate-si/sources/mk_collect.py

      # The commit may contain ONLY raw station CSVs — assert it, do not trust it.
      # Derived tables and the intermediate DB are gitignored (T-5.7c), and the
      # requests cache is gitignored (T-5.7d), so a well-behaved run touches only
      # data/climate-si/data/raw/<Station>.csv. Anything else fails the run loudly.
      # No changes at all -> exit cleanly here without opening an empty PR.
      - name: Assert only raw CSVs changed, detect scope
        id: scope
        run: |
          changes="$(git status --porcelain)"
          if [ -z "$changes" ]; then
            echo "No changes produced by the refresh — nothing to open a PR for."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Working-tree changes:"
          echo "$changes"
          paths="$(echo "$changes" | cut -c4-)"
          offending="$(echo "$paths" | grep -vE '^data/climate-si/data/raw/[A-Za-z_]+\.csv$' || true)"
          if [ -n "$offending" ]; then
            echo "::error::Refresh changed files outside data/climate-si/data/raw/*.csv — refusing to open a PR:"
            echo "$offending"
            exit 1
          fi
          stations="$(echo "$paths" | sed -E 's#.*/([A-Za-z_]+)\.csv$#\1#' | sort -u | paste -sd ', ' -)"
          count="$(echo "$paths" | grep -c . )"
          {
            echo "changed=true"
            echo "stations=$stations"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"
          echo "Refreshed stations: $stations"

      # --- Everything below runs only when the refresh actually produced changes. ---

      # Raw-input contract — the SAME definition validate-data.yaml runs on PRs.
      - name: Validate raw station inputs
        id: validate_raw
        if: steps.scope.outputs.changed == 'true'
        uses: ./.github/actions/validate-raw-data

      # Derived pipeline — a raw row can pass validate_raw and still break precompute
      # (a validate.py bound, or a Fisk-fit failure withholding SPEI under D-16). Since
      # docker-data.yaml won't auto-run on the token-opened PR either, build+validate
      # the nine derived tables here. precompute_datasette.main() runs validate_tables
      # BEFORE the first to_sql, so a violation aborts non-zero and no PR is opened.
      # Network-free: it computes only from the raw CSVs on disk. DB output is gitignored.
      - name: Validate derived pipeline (precompute + validate)
        id: precompute
        if: steps.scope.outputs.changed == 'true'
        env:
          DATA_DIR: data/climate-si/data/raw
        run: uv run --project data/climate-si/sources python data/climate-si/sources/precompute_datasette.py

      # Open the PR with first-party tooling only (git + gh) — no third-party action,
      # so no extra pinned supply-chain dependency. Unique dated branch per run means a
      # plain push, never a force-push. `git add` is scoped to the raw CSVs (the scope
      # step already proved nothing else changed). If gh/push fails, the run fails loudly.
      # Ensure the PR label exists BEFORE `gh pr create --label` — gh resolves
      # label names to node IDs and aborts before creating the PR if the name is
      # unknown, which on a first run (empty repo) would fetch ~20 min, push the
      # branch, then fail at creation and leave an orphan branch with no PR.
      - name: Ensure data-refresh label
        if: steps.scope.outputs.changed == 'true'
        uses: ./.github/actions/ensure-label
        with:
          name: data-refresh
          color: D5C9EF
          description: "Automated: daily raw ERA5-Land refresh PR"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open pull request with raw appends
        id: open_pr
        if: steps.scope.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          STATIONS: ${{ steps.scope.outputs.stations }}
          COUNT: ${{ steps.scope.outputs.count }}
        run: |
          set -euo pipefail
          date_tag="$(date -u +%Y%m%d)"
          branch="data-refresh/${date_tag}-${RUN_ID}"
          run_url="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"

          # Record the branch name for the failure-alert step BEFORE the push, so
          # that if a later command aborts, the alert can name the branch. Outputs
          # written to $GITHUB_OUTPUT survive a subsequent step failure.
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/climate-si/data/raw/*.csv
          git commit -m "data: daily raw ERA5-Land refresh (${date_tag})"

          # persist-credentials:false left no git credential — push over an explicit
          # tokened URL (GH_TOKEN is masked in logs). A new branch each run = plain push.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$branch"

          # The push landed. Record it so that if `gh pr create` below fails, the
          # alert step reports a pushed-but-PR-less orphan branch, not "nothing
          # written". This is the one partial state that leaves data on origin.
          echo "pushed=true" >> "$GITHUB_OUTPUT"

          cat > /tmp/pr-body.md <<EOF
          ## Daily raw data refresh

          Differential refresh of the committed ERA5-Land raw station CSVs
          (\`mk_collect.py\`, no \`--force-refresh\`). This PR contains **raw appends only**.

          - **Stations changed (${COUNT}):** ${STATIONS}
          - **Scope asserted:** only \`data/climate-si/data/raw/*.csv\` were modified.

          ### ⚠️ This PR carries NO automated checks by design
          It was opened by a workflow using \`GITHUB_TOKEN\`, so GitHub does not trigger
          \`pull_request\` workflows on it (validate-data / docker-data / build will not
          run automatically). Instead, the refresh run validated everything **before**
          opening this PR:

          1. \`validate_raw.py\` — raw-input schema (same contract as the PR gate).
          2. \`precompute_datasette.py\` — builds and validates all nine derived tables.

          The derived-table hash gate is NOT re-checked here: it hashes a frozen fixture
          (tests/test_reference_manifest.py), so it moves only on code changes, and this
          PR is data-only. Merging to \`main\` triggers the normal build + datasette image.

          **Run log (what was checked):** ${run_url}

          ### A human must review before merge
          Confirm the appended dates/values look right, then merge. Merging to \`main\`
          triggers the normal build + datasette image (which re-validates).
          EOF

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Daily raw data refresh (${date_tag})" \
            --body-file /tmp/pr-body.md \
            --label data-refresh

      # --- Failure alerting (T-6.6a) ------------------------------------------
      # D-19 makes the refresh validate in-job and open NO PR on failure, which
      # makes "a real failure" indistinguishable from "no new data today" unless a
      # human happens to watch the run. This step closes that gap and was the HARD
      # prerequisite (D-19) for enabling the `schedule:` block (done in T-5.43).
      #
      # Fires on ANY real INCIDENT (fetch, scope-assert, validate-raw, precompute,
      # PR-open, or an infra failure of checkout/setup-uv). Deliberately does NOT
      # fire in two cases:
      #   * the confirmation guard aborted — `steps.confirm.outcome == 'failure'`
      #     means someone dispatched manually without typing `spend-quota`; that is
      #     a user error, not an incident. NOTE the condition tests `!= 'failure'`,
      #     NOT `== 'success'`: on a SCHEDULED run the guard is SKIPPED (outcome
      #     'skipped'), and `== 'success'` would then wrongly suppress every
      #     scheduled incident — the exact coupling T-5.43 had to fix when the guard
      #     became dispatch-only;
      #   * the job SUCCEEDED — which includes the legitimate "nothing changed, no
      #     PR" path, where the scope step exits 0 and `failure()` is false.
      # Dedupe: repeat incidents COMMENT on the one open `refresh-failure` issue
      # rather than opening a new one, so a stuck refresh cannot produce 365 issues.
      # The body names the failed step, links the run, and — critically — states
      # whether anything was written to origin (only the PR step pushes). Ensure the
      # dedupe label exists via the SAME action the PR label uses, so there is one
      # way to ensure a label, not two copies (D-18/D-19).
      - name: Ensure refresh-failure label
        if: failure() && steps.confirm.outcome != 'failure'
        uses: ./.github/actions/ensure-label
        with:
          name: refresh-failure
          color: B60205
          description: "Automated: a daily data-refresh run failed"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Alert on refresh failure
        if: failure() && steps.confirm.outcome != 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_UV_OUTCOME: ${{ steps.setup_uv.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          VALIDATE_RAW_OUTCOME: ${{ steps.validate_raw.outcome }}
          PRECOMPUTE_OUTCOME: ${{ steps.precompute.outcome }}
          OPEN_PR_OUTCOME: ${{ steps.open_pr.outcome }}
          PR_BRANCH: ${{ steps.open_pr.outputs.branch }}
          PR_PUSHED: ${{ steps.open_pr.outputs.pushed }}
        run: |
          set -euo pipefail

          # Which step failed — the first in run order whose outcome is 'failure'
          # (earlier steps are 'success', later ones 'skipped').
          if [ "$CHECKOUT_OUTCOME" = "failure" ]; then
            failed="Checkout repository (infrastructure)"
          elif [ "$SETUP_UV_OUTCOME" = "failure" ]; then
            failed="Install uv (infrastructure)"
          elif [ "$FETCH_OUTCOME" = "failure" ]; then
            failed="Refresh raw station data (mk_collect.py, differential fetch)"
          elif [ "$SCOPE_OUTCOME" = "failure" ]; then
            failed="Assert only raw CSVs changed / detect scope"
          elif [ "$VALIDATE_RAW_OUTCOME" = "failure" ]; then
            failed="Validate raw station inputs (validate_raw.py)"
          elif [ "$PRECOMPUTE_OUTCOME" = "failure" ]; then
            failed="Validate derived pipeline (precompute_datasette.py)"
          elif [ "$OPEN_PR_OUTCOME" = "failure" ]; then
            failed="Open pull request with raw appends"
          else
            failed="Unknown — no step reported failure; read the run log"
          fi

          # Was anything written to origin? Only the PR step pushes; it records
          # branch + pushed via step outputs. Every earlier failure leaves changes
          # solely in the ephemeral runner working tree, which is discarded — so
          # nothing persists to the repository.
          if [ "${PR_PUSHED:-}" = "true" ]; then
            raw_state="⚠️ **A branch WAS pushed to origin: \`${PR_BRANCH}\`.** It carries this run's raw-CSV commit, but because the failure was in the PR step **no pull request was opened** — the branch is orphaned. Inspect it, then delete if unwanted: \`git push origin --delete ${PR_BRANCH}\`."
          elif [ -n "${PR_BRANCH:-}" ]; then
            raw_state="The push did **not** complete. Branch \`${PR_BRANCH}\` existed only in the discarded runner — **nothing was written to the repository.**"
          else
            raw_state="**Nothing was written to the repository.** mk_collect.py may have modified raw CSVs in the runner's working tree, but that tree is ephemeral and is discarded with the runner — no branch reached origin."
          fi

          cat > "${RUNNER_TEMP}/issue-body.md" <<EOF
          ## Daily data refresh FAILED

          The \`Daily data refresh\` run did not complete. Under D-19 the refresh
          validates in-job and opens **no PR** on failure, so this would otherwise
          be silent — hence this issue.

          - **Failed step:** ${failed}
          - **Run:** ${RUN_URL} (attempt ${RUN_ATTEMPT})
          - **Raw data / branch state:** ${raw_state}

          ### What an on-call person should do
          1. Open the run log above and read the failed step.
          2. If a branch was pushed (see above), inspect or delete it — it is
             behind no PR and is not cleaned up automatically.
          3. mk_collect.py writes one CSV per station, so a mid-fetch failure can
             leave partial appends in the (now-discarded) runner tree; once the
             cause is fixed, a fresh differential re-dispatch is safe.

          ---
          <sub>Opened automatically by \`.github/workflows/data-refresh.yaml\`
          (T-6.6a). Deduped by the \`refresh-failure\` label — repeat failures
          comment here rather than opening new issues.</sub>
          EOF

          # (The refresh-failure label is ensured by the preceding step, via the
          # shared ensure-label action.)
          # Dedupe: comment on the open refresh-failure issue if one exists, else
          # open a new one.
          existing="$(gh issue list --label refresh-failure --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Existing open refresh-failure issue #${existing} — commenting."
            gh issue comment "$existing" --body-file "${RUNNER_TEMP}/issue-body.md"
          else
            echo "No open refresh-failure issue — creating one."
            gh issue create \
              --title "Daily data refresh failed" \
              --body-file "${RUNNER_TEMP}/issue-body.md" \
              --label refresh-failure
          fi
