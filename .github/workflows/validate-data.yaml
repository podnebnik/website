name: Validate data

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-data.yaml'
      - 'data/**'
  pull_request:
    paths:
      - '.github/workflows/validate-data.yaml'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read # to allow the action to read the repository contents

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true # add this to download LFS files
          submodules: true # add this to download submodules
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      # T-5.7c: climate-si is excluded here. Its nine resources are generated at
      # datasette image-build time (not committed), so a clean checkout has no
      # files for frictionless to load — it would exit non-zero on missing sources.
      # Those tables are validated by data/climate-si/sources/validate.py during the
      # image build (precompute_datasette.main() calls validate_tables before writing,
      # aborting the build on any violation), so this is redundant, not a gap.
      # Emissions and temperature keep their committed CSVs and are still validated.
      - name: Validate data
        run: find ./data -name '*package.yaml' -not -path '*/climate-si/*' -print0 | xargs -0 -I {} sh -c 'echo "\nValidating {}:"; uvx frictionless validate {}'
        # run: uv run --group=build invoke validate

      # T-5.11: the climate-si *raw* per-station inputs ARE committed (unlike the nine
      # derived tables, which are generated at image build and validated there by
      # validate.py). Nothing else checks them on the PR, so a malformed raw row would
      # otherwise pass every gate and fail only at image build, after merge, naming a
      # derived table.
      #
      # T-5.7d: the actual validate_raw.py invocation lives in a composite action so
      # that this PR gate and the weekly refresh (data-refresh.yaml) validate the raw
      # inputs against ONE definition. The refresh matters because a PR opened by the
      # workflow's GITHUB_TOKEN does not trigger this pull_request job, so the refresh
      # must run the same contract in-job before opening its PR — see data-refresh.yaml.
      - name: Validate raw station inputs
        uses: ./.github/actions/validate-raw-data
