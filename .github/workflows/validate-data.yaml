name: Validate data

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-data.yaml'
      - 'data/**'
  pull_request:
    paths:
      - '.github/workflows/validate-data.yaml'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read # to allow the action to read the repository contents

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true # add this to download LFS files
          submodules: true # add this to download submodules
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      # T-5.7c: climate-si is excluded here. Its nine resources are generated at
      # datasette image-build time (not committed), so a clean checkout has no
      # files for frictionless to load — it would exit non-zero on missing sources.
      # Those tables are validated by data/climate-si/sources/validate.py during the
      # image build (precompute_datasette.main() calls validate_tables before writing,
      # aborting the build on any violation), so this is redundant, not a gap.
      # Emissions and temperature keep their committed CSVs and are still validated.
      - name: Validate data
        run: find ./data -name '*package.yaml' -not -path '*/climate-si/*' -print0 | xargs -0 -I {} sh -c 'echo "\nValidating {}:"; uvx frictionless validate {}'
        # run: uv run --group=build invoke validate
