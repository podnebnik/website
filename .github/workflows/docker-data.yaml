name: "Docker: datasette"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/docker-data.yaml'
      - '.dockerignore'
      - 'deployment/Dockerfile.datasette'
      - 'pyproject.toml'
      - 'uv.lock'
      - '**.py'
      - 'data/**'
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - "main"
    paths:
      - '.github/workflows/docker-data.yaml'
      - '.dockerignore'
      - 'deployment/Dockerfile.datasette'
      - 'pyproject.toml'
      - 'uv.lock'
      - '**.py'
      - 'data/**'

permissions: {}

jobs:
  # ── T-5.9: generate the shipped SQLite ONCE, on a native amd64 runner ──────────
  # The numpy-heavy precompute pipeline runs here and nowhere else. Building only
  # the Dockerfile's `db-export` target on linux/amd64 exports /build/var/sqlite —
  # the .db files plus datasette metadata/inspect JSON — to the local filesystem,
  # which is uploaded as an artifact for the multi-arch image build to consume. The
  # generated DB is architecture-independent, so a single amd64 generation feeds
  # both image variants; the previous per-arch generation (a multi-hour arm64 run
  # under QEMU) is removed by construction. precompute_datasette.py validates the
  # tables in memory before writing, so a broken pipeline fails this job — and the
  # `docker` job below `needs:` it, so nothing is built or pushed on failure.
  generate-db:
    runs-on: ubuntu-latest
    permissions:
      contents: read # to allow the action to read the repository contents
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      -
        name: Generate datasette SQLite (amd64, once)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./deployment/Dockerfile.datasette
          target: db-export
          platforms: linux/amd64
          push: false
          outputs: type=local,dest=generated-sqlite
      -
        name: Upload generated SQLite artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datasette-sqlite
          path: generated-sqlite
          if-no-files-found: error
          retention-days: 1

  docker:
    needs: generate-db
    runs-on: ubuntu-latest
    permissions:
      contents: read # to allow the action to read the repository contents
      packages: write # to allow the action to push Docker images to GitHub Packages
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      -
        name: Get Git information
        id: git-info
        run: |
          echo "branch=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date +%s)" >> "$GITHUB_OUTPUT"
        shell: bash

      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/data
          tags: |
            type=raw,value=${{ steps.git-info.outputs.branch }}-${{ steps.git-info.outputs.short_sha }}-${{ steps.git-info.outputs.timestamp }}
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
      -
        # ── T-5.9: pull in the single amd64-generated SQLite ──────────────────────
        # Placed at deployment/generated-sqlite/ so the runtime stage's
        # `COPY deployment/generated-sqlite /datasette/sqlite` finds it in the build
        # context. .dockerignore excludes `var/` but not this path, so it ships.
        name: Download generated SQLite artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: datasette-sqlite
          path: deployment/generated-sqlite
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          platforms: linux/amd64,linux/arm64
      -
        name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        # ── T-5.9: multi-arch image, no generation ────────────────────────────────
        # Builds only the `runtime` target, which COPYs the downloaded DB and never
        # depends on `builder`. The arm64 variant therefore installs datasette under
        # emulation (fast) but runs no numpy pipeline.
        name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./deployment/Dockerfile.datasette
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
