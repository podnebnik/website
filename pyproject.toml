[project]
name = "podnebnik-datasette"
version = "0.1"
description = "Podnebnik datasette"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasette == 0.65.*",
]

[dependency-groups]
build = [
    "colorama",
    "frictionless==5.19.*",
    "invoke",
    "sqlite-utils",
]

# T-4.22: setuptools is a transitive dependency of datasette; GHSA-h35f-9h28-mq5c
# (< 83.0.0) is patched in 83.0.0. Constrain it up without adding a direct dep.
[tool.uv]
constraint-dependencies = ["setuptools>=83.0.0"]
